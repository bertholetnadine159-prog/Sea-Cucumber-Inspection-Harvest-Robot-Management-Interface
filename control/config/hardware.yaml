robot:
  name: sea_cucumber_suction_robot
  platform: RDK_X5
  flight_controller: Pixhawk 2.4.8

runtime:
  simulation: false
  sensor_poll_hz: 10
  camera_poll_hz: 15

rdk_x5:
  # The bus ids below are practical defaults and must be verified on the target
  # RDK_X5 image with `ls /dev/i2c-*` and `i2cdetect -y <bus>`.
  i2c:
    veml7700_1:
      enabled: true
      name: veml7700_front_light
      bus: 5
      address: 0x10
      sda_pin: 3
      scl_pin: 5
    veml7700_2:
      enabled: true
      name: veml7700_down_light
      bus: 0
      address: 0x10
      sda_pin: 27
      scl_pin: 28
    ms5837_30ba:
      enabled: true
      name: ms5837_depth
      # 2026-09-21 板上实测迁移：MS5837-30BA 挂 40-pin I2C5（3脚SDA/5脚SCL，341c0000.i2c），
      # 与 VEML7700 前视同总线共存（0x76 vs 0x10）。旧 I2C1 方案（32/33脚）作废——板上
      # 340c0000.i2c/i2c1grp 仍占 32/33 垫，但器件不在该总线应答（docs/PINMAP.md §3/§5.7）。
      bus: 5
      address: 0x76
      alternate_address: 0x77
      sda_pin: 3
      scl_pin: 5
      pinmux_required: false   # I2C5 为 X5 默认使能（pinmux i2c5grp ALT1）
      pinmux_function: i2c
      model: MS5837-30BA
      fluid_density_kg_m3: 1029.0
  one_wire:
    ds18b20_1:
      enabled: true
      name: ds18b20_water_1
      # DATA=40-pin 37脚（BCM26）。出厂表 CVM 名"GPIO26"是 BCM 名，不是 lsio 线号：
      # 37脚垫=SOC401=lsio 线22，overlay onewire-0 绑此（w1_bus_master1）。11/13脚是 UART7 勿用。
      data_pin: 37
      gpio: 26
      device_id: null
      sysfs_root: /sys/bus/w1/devices
    ds18b20_2:
      enabled: true
      name: ds18b20_water_2
      # DATA=40-pin 15脚（BCM22，出厂 CVM 名"GPIO22"同理是 BCM 名）：15脚垫=SOC388=lsio 线9，
      # overlay onewire-1 绑此（w1_bus_master2）。PIN17 为 3.3V 电源脚（权威表），可作供电。
      # 映射考证 docs/PINMAP.md §4。
      power_pin: 17
      data_pin: 15
      gpio: 22
      device_id: null
      sysfs_root: /sys/bus/w1/devices

ultrasonic_usb:
  front:
    enabled: true
    name: ultrasonic_front_suction_mouth
    role: front_distance_to_target
    port: /dev/ttyUSB0
    baudrate: 9600
    protocol: ff_uart
    timeout_s: 0.08
    min_valid_m: 0.03
    max_valid_m: 4.5
    near_range_fault_below_m: 0.04
  downward:
    enabled: true
    name: ultrasonic_downward_altitude
    role: bottom_distance
    port: /dev/ttyUSB1
    baudrate: 9600
    protocol: ff_uart
    timeout_s: 0.08
    min_valid_m: 0.03
    max_valid_m: 4.5

cameras:
  camera_1:
    enabled: true
    role: front
    device: 0
    width: 1280
    height: 720
    fps: 30
    default_open: true
  camera_2:
    enabled: true
    role: suction_mouth
    device: 1
    width: 1280
    height: 720
    fps: 30
    default_open: false
