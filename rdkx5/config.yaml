# ============================================================================
# [RDK X5 side] 配置文件 —— 在 RDK X5 上使用，不要与 PC 端配置混淆
# ============================================================================
server:
  host: 0.0.0.0          # 监听所有网口
  port: 8080             # PC 通过 ws://192.168.127.10:8080 连接

video:
  source: mipi           # mipi | usb | simulation
  camera_id: 0           # MIPI camera id；USB 模式为 /dev/video 索引
  width: 1280
  height: 720
  fps: 15
  jpeg_quality: 78

vision:
  enabled: true
  backend: rdk_bin       # rdk_bin（BPU 上运行）| none
  model_path: ./YOLO11_LBL.bin
  yolo_script: ./yolo11_seg_rdk.py
  confidence_threshold: 0.25
  iou_threshold: 0.45
  mask_threshold: 0.5
  class_names: [sea_cucumber]

telemetry:
  hz: 5

safety:
  deadman_ms: 1000
  emergency_stop_disarm: false   # 急停时是否同时 disarm（默认只回中，不上锁）

pixhawk:
  enabled: true
  connection: /dev/ttyACM0       # RDK X5 与 Pixhawk 2.4.8 的 USB 串口
  baud: 115200
  heartbeat_timeout_s: 3.0
  # 控制方式：
  #   manual_control : ArduSub MANUAL_CONTROL（推荐，保留飞控稳定回路与混控）
  #   servo_pwm      : MAV_CMD_DO_SET_SERVO 直通 PWM（兼容 PX4/任意固件，需上位机混控）
  control_mode: manual_control
  manual_control_hz: 25
  servo_pwm_hz: 20
  # servo_pwm 模式下的 8 个推进器通道 + AUX 通道映射
  channel_map:
    surge: 1
    sway: 2
    heave: 3
    roll: 4
    pitch: 5
    yaw: 6
  neutral_pwm: 1500
  pwm_span: 400
  suction_channels: [9, 10]      # AUX1 / AUX2
  servo_channel: 11              # AUX3 抓取舵机
  light_channels: []             # 可选：灯光 PWM 通道

sensors:
  enabled: true
  simulation: false
  veml7700_front:
    enabled: true
    bus: 5
    address: 0x10
  veml7700_down:
    enabled: true
    bus: 0
    address: 0x10
  ms5837:
    enabled: true
    bus: 1
    address: 0x76
    model: MS5837-30BA
    fluid_density_kg_m3: 1029.0
  ds18b20_1:
    enabled: true
    sysfs_root: /sys/bus/w1/devices
    device_id: null
  ds18b20_2:
    enabled: true
    sysfs_root: /sys/bus/w1/devices
    device_id: null
  ultrasonic_front:
    enabled: true
    port: /dev/ttyUSB0
    baudrate: 9600
    protocol: ff_uart
  ultrasonic_downward:
    enabled: true
    port: /dev/ttyUSB1
    baudrate: 9600
    protocol: ff_uart
