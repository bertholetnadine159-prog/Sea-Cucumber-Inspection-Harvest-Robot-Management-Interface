<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - ROV Management System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3b82f6",
                    },
                    fontFamily: {
                        songti: ["SimSun", "Songti SC", "STSong", "serif"],
                        times: ["Times New Roman", "serif"],
                    },
                },
            },
        };
    </script>
<style type="text/tailwindcss">
        body {
            @apply bg-slate-50;
        }
        .chinese-text {
            font-family: "SimSun", "Songti SC", "STSong", serif;
        }
        .english-text {
            font-family: "Times New Roman", serif;
        }
        .bg-underwater {
            background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuDXYooQ0DN8BgeYPnsz3EhhZ1IvlebwlxqF6c_LVMvTO3gumcL2ZtdtpNC3JqLWzR9OwlLzQaMsi__uHi3Rm6kWAVmzuQAJLO7g5UBjFiMuD8ifGtWkf26JDnX5-4iC79gOssNumvDM7F987LRWnA5Fw7C0b4FCjWMLVj3C41ECXpONRSs_0JODsHlq25_WtTEz6L5DihYD6-obuhxsK8kquVWmAiK6IYgTUNpMVoZKCSYpbd2sFaeOZxZ6BrVAlcvIId5-nh57_5wF);
            background-size: cover;
            background-position: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .material-symbols-outlined {
            font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-serif">
<div class="fixed inset-0 bg-underwater z-0">
<div class="absolute inset-0 bg-blue-900/20 backdrop-blur-sm"></div>
</div>
<main class="flex-grow flex items-center justify-center relative z-10 p-6">
<div class="glass-card w-full max-w-[480px] rounded-3xl shadow-2xl p-10 md:p-12">
<div class="text-center mb-10">
<div class="bg-primary/10 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-primary text-4xl">lock_reset</span>
</div>
<h1 class="text-3xl font-bold text-slate-800 chinese-text tracking-wider mb-2">
                    找回密码
                </h1>
<p class="text-sm font-medium text-slate-500 english-text tracking-[0.2em] uppercase">
                    Reset Password
                </p>
<p class="text-sm text-slate-500 chinese-text mt-4 mb-2">
                    请输入您的注册邮箱，我们将向您发送密码重置链接。
                </p>
</div>
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block text-sm font-semibold text-slate-600 mb-2 chinese-text">
                        邮箱地址 / <span class="english-text">Email Address</span>
</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent transition-all english-text" placeholder="Enter your email address" type="email" required/>
</div>
</div>
<button class="w-full bg-primary hover:bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="submit">
<span class="chinese-text">发送验证邮件</span>
<span class="english-text text-base font-normal">(SEND EMAIL)</span>
</button>
<div class="text-center pt-2">
<a class="text-sm text-primary hover:text-blue-700 font-medium transition-colors chinese-text flex items-center justify-center space-x-1" href="code.html">
<span class="material-symbols-outlined text-base">arrow_back</span>
<span>返回登录 <span class="english-text text-xs">(Back to Login)</span></span>
</a>
</div>
</form>
</div>
</main>
<footer class="relative z-10 py-6 text-center">
<div class="text-xs text-slate-100/70 tracking-wide">
<span class="chinese-text"></span>
<span class="mx-2 font-light">|</span>
<span class="english-text">v2.1.0</span>
</div>
</footer>

</body></html>
