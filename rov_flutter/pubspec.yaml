name: rov_flutter
description: "SeaUI - 海参检测机器人管理系统 (ROV Management System)"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  file_picker: ^8.0.0+1
  web_socket_channel: ^3.0.1
  http: ^1.2.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - assets/users/

  # 字体本地化（契约：离线可用，禁止运行时联网加载字体）
  # Noto Sans SC：中文界面主字体；Inter：数据/数字展示英文字体
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
