name: rov_flutter
description: "海参检测机器人管理系统 - ROV Management System"
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.1
  sqflite: ^2.3.0
  file_picker: ^8.0.0+1
  web_socket_channel: ^3.0.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/data/
    - assets/users/
   